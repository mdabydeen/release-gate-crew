name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

env:
  DOCKER_AGENT_VERSION: v1.150.0
  TELEMETRY_ENABLED: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Install docker-agent ${{ env.DOCKER_AGENT_VERSION }}
        run: |
          curl -fsSL -o docker-agent \
            "https://github.com/docker/docker-agent/releases/download/${DOCKER_AGENT_VERSION}/docker-agent-linux-amd64"
          chmod +x docker-agent
          sudo mv docker-agent /usr/local/bin/docker-agent
          docker-agent version
      - name: Integration tests (docker-agent + stub model)
        run: make integration
